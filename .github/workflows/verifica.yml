name: Verifica fonti (prova tecnica)
on:
  workflow_dispatch:
    inputs:
      script:
        default: sonda.py
permissions:
  contents: write
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright && python -m playwright install --with-deps chromium
      - run: python verifica/${{ inputs.script }}
      - name: Salva l'esito nel ramo "verifica-esiti"
        if: always()
        run: |
          cd verifica/out
          git init -q -b verifica-esiti
          git config user.name "radar-bandi" && git config user.email "radar-bandi@users.noreply.github.com"
          git add -A && git commit -qm "Esito verifica"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" verifica-esiti
