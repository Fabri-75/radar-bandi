name: Verifica fonti (prova tecnica)
on:
  workflow_dispatch:
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python verifica/sonda.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esito-verifica
          path: verifica/out/
