          - "VV - Vibo Valentia"
      riparti:
        description: "Considera tutto come nuovo (ricomincia da zero)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"   # ogni lunedì alle 5:17 (ora italiana d'inverno)
permissions:
  contents: write
concurrency:
  group: radar-bandi
  cancel-in-progress: false
jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa i programmi
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Cerca i bandi
        env:
          RADAR_RIPARTI: ${{ inputs.riparti && '1' || '0' }}
        run: |
          if [ -n "${{ inputs.provincia }}" ]; then
            LISTA=$(echo "${{ inputs.provincia }}" | cut -c1-2)
          else
            LISTA=$(python -c "import yaml;print(' '.join(yaml.safe_load(open('impostazioni.yml'))['province_settimanali']))")
          fi
          for P in $LISTA; do
            P=${P:0:2}
            echo "::group::Provincia $P"
            python -m radar.main "$P"
            echo "::endgroup::"
          done
      - name: Salva i risultati
        run: |
          git config user.name "radar-bandi"
          git config user.email "radar-bandi@users.noreply.github.com"
          git add docs/dati
          git commit -m "Risultati della ricerca $(date +%d/%m/%Y)" || echo "Nessuna novità"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
