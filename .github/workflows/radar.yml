          - "PU - Pesaro e Urbino"
          - "PV - Pavia"
          - "PZ - Potenza"
          - "RA - Ravenna"
          - "RC - Reggio Calabria"
          - "RE - Reggio Emilia"
          - "RG - Ragusa"
          - "RI - Rieti"
          - "RM - Roma"
          - "RN - Rimini"
          - "RO - Rovigo"
          - "SA - Salerno"
          - "SI - Siena"
          - "SO - Sondrio"
          - "SP - La Spezia"
          - "SR - Siracusa"
          - "SS - Sassari"
          - "SU - Sud Sardegna"
          - "SV - Savona"
          - "TA - Taranto"
          - "TE - Teramo"
          - "TN - Trento"
          - "TO - Torino"
          - "TP - Trapani"
          - "TR - Terni"
          - "TS - Trieste"
          - "TV - Treviso"
          - "UD - Udine"
          - "VA - Varese"
          - "VB - Verbano-Cusio-Ossola"
          - "VC - Vercelli"
          - "VE - Venezia"
          - "VI - Vicenza"
          - "VR - Verona"
          - "VT - Viterbo"
          - "VV - Vibo Valentia"
      riparti:
        description: "Considera tutto come nuovo (ricomincia da zero)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"   # ogni lunedì alle 5:17 (ora italiana d'inverno)
permissions:
  contents: write
concurrency:
  group: radar-bandi
  cancel-in-progress: false
jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      province: ${{ steps.p.outputs.province }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          SCELTA="${{ inputs.provincia }}"
          if [ -z "$SCELTA" ] || [ "${SCELTA:0:9}" = "LOMBARDIA" ]; then
            LISTA=$(python3 -c "import yaml,json;print(json.dumps(yaml.safe_load(open('impostazioni.yml'))['province_settimanali']))")
          else
            LISTA="[\"${SCELTA:0:2}\"]"
          fi
          echo "province=$LISTA" >> "$GITHUB_OUTPUT"
          echo "Province: $LISTA"

  cerca:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provincia: ${{ fromJson(needs.prepara.outputs.province) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa i programmi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ita > /dev/null
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Cerca i bandi (${{ matrix.provincia }})
        env:
          RADAR_RIPARTI: ${{ inputs.riparti && '1' || '0' }}
        run: python -m radar.main "${{ matrix.provincia }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risultati-${{ matrix.provincia }}
          path: |
            docs/dati/${{ matrix.provincia }}.json
            registro/${{ matrix.provincia }}.txt
          retention-days: 3
          if-no-files-found: ignore

  salva:
    needs: cerca
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: nuovi
          pattern: risultati-*
          merge-multiple: true
      - name: Salva i risultati
        run: |
          ls -R nuovi | head -50
          find nuovi -name "??.json" -exec cp {} docs/dati/ \;
          mkdir -p registro && find nuovi -name "??.txt" -exec cp {} registro/ \;
          python -m radar.indice docs/dati
          git config user.name "radar-bandi"
          git config user.email "radar-bandi@users.noreply.github.com"
          git add docs/dati registro
          git commit -m "Risultati della ricerca $(date +%d/%m/%Y)" || echo "Nessuna novità"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
