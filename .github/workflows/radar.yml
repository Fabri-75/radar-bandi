          - "IS - Isernia"
          - "KR - Crotone"
          - "LC - Lecco"
          - "LE - Lecce"
          - "LI - Livorno"
          - "LO - Lodi"
          - "LT - Latina"
          - "LU - Lucca"
          - "MB - Monza e Brianza"
          - "MC - Macerata"
          - "ME - Messina"
          - "MI - Milano"
          - "MN - Mantova"
          - "MO - Modena"
          - "MS - Massa-Carrara"
          - "MT - Matera"
          - "NA - Napoli"
          - "NO - Novara"
          - "NU - Nuoro"
          - "OR - Oristano"
          - "PA - Palermo"
